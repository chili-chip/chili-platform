[project]
name = "chili-platform"
version = "0.1.0"
description = "Chili Platform API — Django on Cloudflare Workers with D1 and R2."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "django>=5.2,<6",
    "djangorestframework>=3.15,<4",
    "djangorestframework-simplejwt>=5.4,<6",
    "django-cors-headers>=4.6,<5",
    "django-cf>=0.2.14",
    "tzdata",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-django>=4.14.0",
    "workers-py",
    "workers-runtime-sdk",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "app.settings"
pythonpath = ["src"]
python_files = ["tests.py", "test_*.py"]
testpaths = ["src"]
