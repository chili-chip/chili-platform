[project]
name = "chili-platform"
version = "0.1.0"
description = "Chili Platform API — Django on Cloudflare Workers with D1 and R2."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "django>=5.2,<6",
    "djangorestframework>=3.15,<4",
    "djangorestframework-simplejwt>=5.4,<6",
    "django-cors-headers>=4.6,<5",
    "django-cf>=0.2.14",
    "tzdata",
    "django-easymde>=1.0.4,<2",
]

[dependency-groups]
dev = [
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-django>=4.14.0",
    "ruff>=0.16.10",
    "workers-py",
    "workers-runtime-sdk",
]

[tool.uv]
package = false
# django-easymde lists setuptools but never imports it. Keep it out of the Worker bundle.
override-dependencies = ["setuptools; sys_platform == 'never'"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "app.settings"
pythonpath = ["src"]
python_files = ["tests.py", "test_*.py"]
testpaths = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["src/media", "python_modules", "staticfiles", ".venv-workers"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"*/migrations/*" = ["I"]
