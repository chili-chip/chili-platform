# Lint the OpenAPI spec on pull requests so the Pages site stays valid.
name: Lint API docs

on:
  pull_request:
    paths:
      - docs/**
      - redocly.yaml
      - .github/workflows/docs.yml

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Lint OpenAPI
        run: npx --yes @redocly/cli lint docs/openapi.yaml
