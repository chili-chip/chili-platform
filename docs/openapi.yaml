    get:
      tags: [Marketplace]
      operationId: listMarketplaceTags
      summary: Popular listing tags
      description: Public. Not paginated. Counts only published listings.
      responses:
        "200":
          description: Tags.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MarketplaceTag"

  /api/marketplace/listings/:
    get:
      tags: [Marketplace]
      operationId: listMarketplaceListings
      summary: Search published listings
      description: |
        Public browse. Filters: `q` (title, description, creator, tag),
        `category` (slug), `tag`, `price` (`free` or `paid`), and
        `sort` (`new`, `price_asc`, `price_desc`, `title`).
      parameters:
        - $ref: "#/components/parameters/Page"
        - name: q
          in: query
          schema:
            type: string
        - name: category
          in: query
          schema:
            type: string
        - name: tag
          in: query
          schema:
            type: string
        - name: price
          in: query
          schema:
            type: string
            enum: [free, paid]
        - name: sort
          in: query
          schema:
            type: string
            enum: [new, price_asc, price_desc, title]
      responses:
        "200":
          description: Paginated listings.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedListings"
    post:
      tags: [Marketplace]
      operationId: createMarketplaceListing
      summary: List a released game
      description: |
        The authenticated user must own the game, and the game must already be
        released. Release does not call this endpoint. `price_cents` is `0` for a
        free listing or at least `100` (€1). No payout account is required.
        The user must already have accepted the terms of service, the privacy
        policy, and the marketplace seller terms. Updating an existing listing
        does not ask again.
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MarketplaceListingWrite"
            example:
              game: 1
              price_cents: 500
              category: puzzle
              description: A tiny maze.
              tags: [bitsy, maze]
      responses:
        "201":
          description: Listing created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarketplaceListing"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/marketplace/listings/{slug}/:
    parameters:
      - name: slug
        in: path
        required: true
        schema:
          type: string
    get:
      tags: [Marketplace]
      operationId: getMarketplaceListing
      summary: Game page
      description: Public when the listing is published. The owner can read an unpublished listing.
      responses:
        "200":
          description: Listing.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarketplaceListing"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [Marketplace]
      operationId: updateMarketplaceListing
      summary: Update a listing
      description: Owner only. Price, category, tags, description, and published.
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MarketplaceListingPatch"
      responses:
        "200":
          description: Updated listing.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarketplaceListing"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    delete:
      tags: [Marketplace]
      operationId: deleteMarketplaceListing
      summary: Unlist a game
      description: |
        Deletes the listing when nobody has bought it. Otherwise it is unpublished
        and the body is the listing.
      security: [{bearerAuth: []}]
      responses:
        "200":
          description: Unpublished because purchases exist.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarketplaceListing"
        "204":
          description: Listing deleted.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/marketplace/listings/{slug}/rating/:
    parameters:
      - name: slug
        in: path
        required: true
        schema:
          type: string
    post:
      tags: [Marketplace]
      operationId: rateMarketplaceListing
      summary: Rate a library game
      description: |
        One rating per signed-in user per game. `stars` is an integer from 1 to 5.
        `comment` is optional text, at most 500 characters. Omit it, or send a
        blank string, for a star-only rating. The caller must already have the
        game in their library: they released it, or they have a paid, refunded,
        or disputed purchase. A second submission is rejected, so a comment
        cannot be added later. There is no edit endpoint. The response is the
        listing, including `rating_average`, `rating_count`, `my_rating`, and
        `reviews`.
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MarketplaceRatingWrite"
            example:
              stars: 4
              comment: Tight corridors.
      responses:
        "201":
          description: Rating saved. The body is the listing with the new average.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarketplaceListing"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/marketplace/listings/{slug}/checkout/:
    parameters:
      - name: slug
        in: path
        required: true
        schema:
          type: string
    post:
      tags: [Marketplace]
      operationId: checkoutMarketplaceListing
      summary: Buy or claim a game
      description: |
        Free listings return a paid purchase and no Checkout URL. Paid listings
        open a Stripe Checkout Session charged on Chili's account. The charge
        does not set `application_fee_amount`, `transfer_data`, `on_behalf_of`,
        or `destination`.
      security: [{bearerAuth: []}]
      responses:
        "201":
          description: Claimed, or Checkout started.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarketplaceCheckout"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/marketplace/checkout/confirm/:
    post:
      tags: [Marketplace]
      operationId: confirmMarketplaceCheckout
      summary: Confirm a game Checkout Session
      description: |
        Buyer only. Loads the session from Stripe and records the purchase when
        `payment_status` is `paid`. The webhook is the source of truth.
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [session_id]
              properties:
                session_id:
                  type: string
      responses:
        "200":
          description: Purchase.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarketplacePurchase"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/marketplace/library/:
    get:
      tags: [Marketplace]
      operationId: listMarketplaceLibrary
      summary: Buyer library
      description: Paid, refunded, and disputed purchases for the signed-in user. Pending checkouts are omitted.
      security: [{bearerAuth: []}]
      parameters:
        - $ref: "#/components/parameters/Page"
      responses:
        "200":
          description: Paginated purchases.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedPurchases"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/marketplace/me/:
    get:
      tags: [Marketplace]
      operationId: getMarketplaceSales
      summary: Creator sales
      description: |
        Listings, released games, recent sales, balance, and payout status.
        Projects are omitted.
        Also attempts a payout when the hold has passed, transfers are active,
        and cleared earnings are at least €20.
      security: [{bearerAuth: []}]
      responses:
        "200":
          description: Sales desk.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarketplaceSales"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/marketplace/me/account/:
    get:
      tags: [Marketplace]
      operationId: getMarketplaceAccount
      summary: Refresh payout account status
      description: |
        Re-reads `configuration.recipient.capabilities.stripe_balance` from
        Accounts v2. Does not use `charges_enabled` or `payouts_enabled`.
      security: [{bearerAuth: []}]
      responses:
        "200":
          description: Account status. Empty ids when payout setup has not started.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarketplaceAccount"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [Marketplace]
      operationId: createMarketplaceAccount
      summary: Start payout setup
      description: |
        Creates an Accounts v2 recipient (`dashboard: none`, platform fees and
        losses, `stripe_transfers` requested) the first time the creator asks
        to be paid. Later calls refresh the same account. Requires recorded
        acceptance of the terms of service, the privacy policy, and the
        marketplace seller terms.
      security: [{bearerAuth: []}]
      responses:
        "201":
          description: Connected account.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarketplaceAccount"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/marketplace/me/account-session/:
    post:
      tags: [Marketplace]
      operationId: createMarketplaceAccountSession
      summary: Embedded payout session
      description: |
        Account Session for `account_onboarding`, `notification_banner`,
        `account_management`, and `payouts`. Stripe user authentication is
        disabled so the creator stays on Chili. Requires an account, and the
        same terms and seller-terms acceptance as payout setup.
      security: [{bearerAuth: []}]
      responses:
        "200":
          description: Client secret for Connect.js.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarketplaceAccountSession"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/marketplace/me/payouts/:
    post:
      tags: [Marketplace]
      operationId: createMarketplacePayout
      summary: Transfer cleared earnings
      description: |
        Transfers the cleared balance to the creator when `stripe_transfers`
        and `payouts` are `active` and the balance is at least €20. Otherwise
        `transferred` is false and `blocked_reason` explains why. The transfer
        amount is the creator credit, which is less than the card charge.
      security: [{bearerAuth: []}]
      responses:
        "200":
          description: Payout attempt.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarketplacePayoutResult"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/marketplace/purchases/{id}/refund/:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
    post:
      tags: [Marketplace]
      operationId: refundMarketplacePurchase
      summary: Refund a game purchase
      description: |
        Staff only. Refunds the card charge on Chili's account, then reduces
        unpaid creator earnings or reverses a transfer already sent.
      security: [{bearerAuth: []}]
      responses:
        "200":
          description: Refunded purchase.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarketplacePurchase"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: "Access token from `/api/auth/token/` or `/api/auth/register/`."

  parameters:
    Username:
      name: username
      in: path
      required: true
      schema:
        type: string
        maxLength: 150
        example: pepper
    CategorySlug:
      name: slug
      in: path
      required: true
      schema:
        type: string
        maxLength: 80
        example: general
    PostId:
      name: id
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    CommentId:
      name: id
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    ProductSlug:
      name: slug
      in: path
      required: true
      schema:
        type: string
        maxLength: 140
        example: chilichip-kit
    OrderId:
      name: id
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    GameId:
      name: id
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    Page:
      name: page
      in: query
      required: false
      description: 1-based page number. Page size is 20.
      schema:
        type: integer
        minimum: 1
        default: 1

  responses:
    ValidationError:
      description: Request failed serializer validation.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ValidationError"
    Unauthorized:
      description: Missing, invalid, or insufficient credentials.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorDetail"
          examples:
            jwt:
              value:
                detail: Authentication credentials were not provided.
            ops:
              value:
                detail: Unauthorized.
    Forbidden:
      description: Authenticated but not allowed (not staff / not author).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorDetail"
          example:
            detail: You do not have permission to perform this action.
    NotFound:
      description: Object does not exist.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorDetail"
          example:
            detail: Not found.
    MailNotConfigured:
      description: The Worker has no Cloudflare Email Sending credentials. The body does not include a token.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorDetail"
          example:
            detail: Mail is not configured.

  schemas:
    Health:
      type: object
      required: [status, service]
      properties:
        status:
          type: string
          example: ok
        service:
          type: string
          example: chili-platform

    ErrorDetail:
      type: object
      required: [detail]
      properties:
        detail:
          description: DRF may return a string or a nested error structure.
          oneOf:
            - type: string
            - type: object
              additionalProperties: true

    ValidationError:
      type: object
      additionalProperties:
        type: array
        items:
          type: string
      example:
        password:
          - This field is required.
        email:
          - Enter a valid email address.

    RegisterRequest:
      type: object
      required: [username, email, password, accept_terms]
      properties:
        username:
          type: string
          maxLength: 150
        email:
          type: string
          format: email
        password:
          type: string
          format: password
          writeOnly: true
          description: Checked with Django's password validators (length, common, numeric, similarity).
        accept_terms:
          type: boolean
          description: Must be true. Records terms of service and privacy policy acceptance. Does not accept seller terms.
        bio:
          type: string
          maxLength: 500
          default: ""
        avatar_url:
          type: string
          format: uri
          maxLength: 200
          default: ""

    User:
      type: object
      required:
        - id
        - username
        - email
        - email_verified
        - avatar_url
        - bio
        - terms_accepted_at
        - privacy_accepted_at
        - seller_terms_accepted_at
        - created_at
      properties:
        id:
          type: integer
          readOnly: true
        username:
          type: string
          readOnly: true
        email:
          type: string
          format: email
          readOnly: true
        email_verified:
          type: boolean
          readOnly: true
        avatar_url:
          type: string
        bio:
          type: string
          maxLength: 500
        terms_accepted_at:
          type: ["string", "null"]
          format: date-time
          readOnly: true
          description: Null until the account accepts the terms of service. Existing rows are not backfilled.
        privacy_accepted_at:
          type: ["string", "null"]
          format: date-time
          readOnly: true
          description: Null until the account accepts the privacy policy. Set together with the terms timestamp.
        seller_terms_accepted_at:
          type: ["string", "null"]
          format: date-time
          readOnly: true
          description: Null until the account accepts the marketplace seller terms, before the first listing or payout setup.
        created_at:
          type: string
          format: date-time
          readOnly: true

    LegalAcceptanceRequest:
      type: object
      properties:
        terms:
          type: boolean
          description: When true, record terms of service and privacy policy acceptance if either timestamp is still null.
        seller_terms:
          type: boolean
          description: When true, record marketplace seller terms acceptance if that timestamp is still null.

    PublicProfile:
      type: object
      required: [id, username, avatar_url, bio, created_at]
      properties:
        id:
          type: integer
        username:
          type: string
        avatar_url:
          type: string
        bio:
          type: string
        created_at:
          type: string
          format: date-time

    ProfileUpdate:
      type: object
      properties:
        bio:
          type: string
          maxLength: 500
        avatar_url:
          type: string
          format: uri
          maxLength: 200

    AuthSession:
      type: object
      required: [user, access, refresh]
      properties:
        user:
          $ref: "#/components/schemas/User"
        access:
          type: string
        refresh:
          type: string

    EmailRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email

    EmailChangeRequest:
      type: object
      required: [new_email, password]
      properties:
        new_email:
          type: string
          format: email
        password:
          type: string
          format: password
          writeOnly: true

    EmailChangeConfirmRequest:
      type: object
      required: [token]
      properties:
        token:
          type: string

    UidTokenRequest:
      type: object
      required: [uid, token]
      properties:
        uid:
          type: string
        token:
          type: string

    PasswordResetConfirmRequest:
      type: object
      required: [uid, token, password]
      properties:
        uid:
          type: string
        token:
          type: string
        password:
          type: string
          format: password
          writeOnly: true

    TokenObtainRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string
          format: password

    TokenPair:
      type: object
      required: [access, refresh]
      properties:
        access:
          type: string
        refresh:
          type: string

    TokenRefreshRequest:
      type: object
      required: [refresh]
      properties:
        refresh:
          type: string

    TokenRefreshResponse:
      type: object
      required: [access, refresh]
      properties:
        access:
          type: string
        refresh:
          type: string
          description: Replacement refresh token. The token sent in the request is blacklisted.

    AuthorSnippet:
      type: object
      required: [id, username, avatar_url]
      properties:
        id:
          type: integer
        username:
          type: string
        avatar_url:
          type: string

    ForumCategory:
      type: object
      required: [id, name, slug, description, post_count]
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 80
        slug:
          type: string
          maxLength: 80
          readOnly: true
        description:
          type: string
        post_count:
          type: integer
          readOnly: true

    CategoryWrite:
      type: object
      required: [name]
      properties:
        name:
          type: string
          maxLength: 80
        description:
          type: string
          default: ""

    ForumPost:
      type: object
      required:
        - id
        - title
        - slug
        - content
        - author
        - category
        - category_detail
        - comment_count
        - created_at
      properties:
        id:
          type: integer
          readOnly: true
        title:
          type: string
          maxLength: 160
        slug:
          type: string
          maxLength: 180
          readOnly: true
        content:
          type: string
        author:
          $ref: "#/components/schemas/AuthorSnippet"
        category:
          type: integer
          description: Category primary key.
        category_detail:
          $ref: "#/components/schemas/ForumCategory"
        comment_count:
          type: integer
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true

    PostWrite:
      type: object
      required: [title, content, category]
      properties:
        title:
          type: string
          maxLength: 160
        content:
          type: string
        category:
          type: integer
          description: Category primary key.

    ForumComment:
      type: object
      required: [id, post, author, content, created_at]
      properties:
        id:
          type: integer
          readOnly: true
        post:
          type: integer
        author:
          $ref: "#/components/schemas/AuthorSnippet"
        content:
          type: string
        created_at:
          type: string
          format: date-time
          readOnly: true

    CommentWrite:
      type: object
      required: [post, content]
      properties:
        post:
          type: integer
        content:
          type: string

    CommentNestedWrite:
      type: object
      required: [content]
      properties:
        content:
          type: string

    PaginatedCategories:
      allOf:
        - $ref: "#/components/schemas/Paginated"
        - type: object
          properties:
            results:
              type: array
              items:
                $ref: "#/components/schemas/ForumCategory"

    PaginatedPosts:
      allOf:
        - $ref: "#/components/schemas/Paginated"
        - type: object
          properties:
            results:
              type: array
              items:
                $ref: "#/components/schemas/ForumPost"

    PaginatedComments:
      allOf:
        - $ref: "#/components/schemas/Paginated"
        - type: object
          properties:
            results:
              type: array
              items:
                $ref: "#/components/schemas/ForumComment"

    Game:
      type: object
      required:
        - id
        - title
        - slug
        - owner
        - cover
        - data
        - released
        - listing_slug
        - in_library
        - created_at
        - updated_at
      properties:
        id:
          type: integer
          readOnly: true
        title:
          type: string
          maxLength: 160
        slug:
          type: string
          maxLength: 180
          readOnly: true
        owner:
          type: string
          readOnly: true
          description: Username of the account that saved the game.
          example: pepper
        cover:
          type: string
          readOnly: true
          description: |
            Absolute media URL of the PNG cover, or an empty string when none
            is set. This is never a data URL.
          example: http://localhost:8787/media/games/covers/1/abc.png
        data:
          type: string
          description: |
            Bitsy game source (`serializeWorld`). Empty unless the caller owns
            the game or has it in their library (paid, refunded, or disputed).
        released:
          type: boolean
          readOnly: true
          description: |
            `false` is a project and cannot be sold. `true` means release has
            run. Release does not create a listing.
        listing_slug:
          type: string
          readOnly: true
          description: |
            Slug of the marketplace listing, or empty when the game is not listed.
            Unpublished listings are visible to the owner only.
        in_library:
          type: boolean
          readOnly: true
          description: |
            True when the signed-in caller released this game, or has a paid,
            refunded, or disputed purchase of it. False for projects and for
            anonymous callers.
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true

    GameWrite:
      type: object
      required: [title, data]
      properties:
        title:
          type: string
          maxLength: 160
        data:
          type: string
          description: Bitsy game source. 1.5 MB max.
        cover:
          type: string
          description: |
            Optional PNG data URL (`data:image/png;base64,...`). Omit it on
            PUT to keep the current cover. The stored value is a media URL.

    GamePatch:
      type: object
      description: Any subset of writable game fields. The editor sends `cover` alone.
      properties:
        title:
          type: string
          maxLength: 160
        data:
          type: string
          description: Bitsy game source. 1.5 MB max.
        cover:
          type: string
          description: |
            PNG data URL (`data:image/png;base64,...`), 8 MB max decoded.
            Empty string removes the cover. Responses return a media URL.

    PaginatedGames:
      allOf:
        - $ref: "#/components/schemas/Paginated"
        - type: object
          properties:
            results:
              type: array
              items:
                $ref: "#/components/schemas/Game"

    Product:
      type: object
      required:
        - id
        - name
        - slug
        - category
        - category_name
        - short_description
        - long_description
        - sku
        - price_cents
        - currency
        - image_url
        - images
        - stock
        - is_active
        - created_at
        - updated_at
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 120
        slug:
          type: string
          maxLength: 140
          readOnly: true
        category:
          type: [string, "null"]
          description: Category slug.
          example: pcbs
        category_name:
          type: string
          readOnly: true
          example: PCBs
        short_description:
          type: string
          maxLength: 280
        long_description:
          type: string
          description: Markdown product copy shown on the product page.
        sku:
          type: string
          maxLength: 40
        price_cents:
          type: integer
          minimum: 1
          description: Unit price in the smallest currency unit (cents for EUR).
        currency:
          type: string
          minLength: 3
          maxLength: 3
          default: eur
        images:
          type: array
          readOnly: true
          items:
            $ref: "#/components/schemas/ProductImage"
        image_url:
          type: string
          readOnly: true
          description: Cover picture URL (first image), empty when none are uploaded.
        stock:
          type: integer
          minimum: 0
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true

    ProductWrite:
      type: object
      required: [name, price_cents]
      properties:
        name:
          type: string
          maxLength: 120
        category:
          type: [string, "null"]
          description: Category slug, or null to clear it.
        short_description:
          type: string
          maxLength: 280
          default: ""
        long_description:
          type: string
          default: ""
          description: Markdown product copy shown on the product page.
        sku:
          type: string
          maxLength: 40
          default: ""
        price_cents:
          type: integer
          minimum: 1
        currency:
          type: string
          minLength: 3
          maxLength: 3
          default: eur
        stock:
          type: integer
          minimum: 0
          default: 0
        is_active:
          type: boolean
          default: true

    StoreCategory:
      type: object
      required: [id, name, slug, description, sort_order, product_count]
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 80
        slug:
          type: string
          maxLength: 100
        description:
          type: string
          maxLength: 280
        sort_order:
          type: integer
          minimum: 0
        product_count:
          type: integer
          readOnly: true
    StoreCategoryWrite:
      type: object
      required: [name]
      properties:
        name:
          type: string
          maxLength: 80
        slug:
          type: string
          maxLength: 100
        description:
          type: string
          maxLength: 280
          default: ""
        sort_order:
          type: integer
          minimum: 0
          default: 0

    ProductImage:
      type: object
      required: [id, url, alt, sort_order]
      properties:
        id:
          type: integer
          readOnly: true
        url:
          type: string
          format: uri
        alt:
          type: string
        sort_order:
          type: integer

    CheckoutItem:
      type: object
      required: [product, quantity]
      properties:
        product:
          type: integer
          description: Product primary key.
        quantity:
          type: integer
          minimum: 1
          maximum: 99

    CheckoutRequest:
      type: object
      required: [items]
      properties:
        items:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/CheckoutItem"

    CheckoutConfirm:
      type: object
      required: [session_id]
      properties:
        session_id:
          type: string
          example: cs_test_123

    CheckoutSession:
      type: object
      required: [checkout_url, session_id, order]
      properties:
        checkout_url:
          type: string
          format: uri
        session_id:
          type: string
        order:
          $ref: "#/components/schemas/Order"

    OrderItem:
      type: object
      required:
        - id
        - product
        - product_name
        - unit_price_cents
        - quantity
        - line_total_cents
      properties:
        id:
          type: integer
        product:
          type: integer
        product_name:
          type: string
        unit_price_cents:
          type: integer
        quantity:
          type: integer
        line_total_cents:
          type: integer
          readOnly: true

    Order:
      type: object
      required:
        - id
        - status
        - currency
        - total_cents
        - items
        - created_at
        - updated_at
      properties:
        id:
          type: integer
          readOnly: true
        status:
          type: string
          enum: [pending, paid, canceled, failed, fulfilled]
        currency:
          type: string
        total_cents:
          type: integer
        stripe_checkout_session_id:
          type: ["string", "null"]
        customer_email:
          type: string
        shipping_name:
          type: string
        shipping_line1:
          type: string
        shipping_line2:
          type: string
        shipping_city:
          type: string
        shipping_state:
          type: string
        shipping_postal_code:
          type: string
        shipping_country:
          type: string
        items:
          type: array
          items:
            $ref: "#/components/schemas/OrderItem"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        paid_at:
          type: ["string", "null"]
          format: date-time

    PaginatedProducts:
      allOf:
        - $ref: "#/components/schemas/Paginated"
        - type: object
          properties:
            results:
              type: array
              items:
                $ref: "#/components/schemas/Product"

    PaginatedOrders:
      allOf:
        - $ref: "#/components/schemas/Paginated"
        - type: object
          properties:
            results:
              type: array
              items:
                $ref: "#/components/schemas/Order"

    Paginated:
      type: object
      required: [count, next, previous, results]
      properties:
        count:
          type: integer
        next:
          type: ["string", "null"]
          format: uri
        previous:
          type: ["string", "null"]
          format: uri
        results:
          type: array
          items: {}

    OpsStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string

    BootstrapStatus:
      type: object
      required: [status, admin]
      properties:
        status:
          type: string
          example: bootstrapped
        admin:
          type: object
          required: [username, created, skipped]
          properties:
            username:
              type: string
            created:
              type: boolean
            skipped:
              type: boolean
              description: "True when `ADMIN_PASSWORD` is empty."
    MarketplaceConfig:
      type: object
      required:
        - currency
        - min_paid_cents
        - min_payout_cents
        - hold_days
        - platform_fee_bps
        - processing_fee_bps
        - processing_fee_fixed_cents
        - stripe_publishable_key
      properties:
        currency:
          type: string
          example: eur
        min_paid_cents:
          type: integer
          description: Paid listings must cost at least this many cents. Zero is free.
          example: 100
        min_payout_cents:
          type: integer
          example: 2000
        hold_days:
          type: integer
          example: 7
        platform_fee_bps:
          type: integer
          description: Basis points kept by Chili. 2000 is 20%.
          example: 2000
        processing_fee_bps:
          type: ["integer", "null"]
          description: |
            Estimated card percentage in basis points. The operator sets
            `MARKETPLACE_PROCESSING_FEE_BPS` from https://stripe.com/pricing
            for the charge currency and method. Null when unset. There is no
            default rate.
        processing_fee_fixed_cents:
          type: ["integer", "null"]
          description: |
            Estimated fixed card fee in cents, added to the basis-point estimate.
            The operator sets `MARKETPLACE_PROCESSING_FEE_FIXED_CENTS` from
            https://stripe.com/pricing for the charge currency and method.
            Null when unset.
        stripe_publishable_key:
          type: string

    MarketplaceCategory:
      type: object
      required: [id, name, slug, description]
      properties:
        id:
          type: integer
        name:
          type: string
        slug:
          type: string
        description:
          type: string

    MarketplaceTag:
      type: object
      required: [name, count]
      properties:
        name:
          type: string
        count:
          type: integer

    MarketplaceGameCard:
      type: object
      required: [id, title, slug, cover, owner]
      properties:
        id:
          type: integer
        title:
          type: string
        slug:
          type: string
        cover:
          type: string
        owner:
          type: string

    MarketplaceListing:
      type: object
      required:
        - id
        - slug
        - description
        - price_cents
        - currency
        - category
        - tags
        - game
        - published
        - owned
        - in_library
        - rating_average
        - rating_count
        - my_rating
        - reviews
        - created_at
        - updated_at
      properties:
        id:
          type: integer
        slug:
          type: string
        description:
          type: string
        price_cents:
          type: integer
        currency:
          type: string
        category:
          type: object
          required: [slug, name]
          properties:
            slug:
              type: string
            name:
              type: string
        tags:
          type: array
          items:
            type: string
        game:
          $ref: "#/components/schemas/MarketplaceGameCard"
        published:
          type: boolean
        owned:
          type: boolean
          description: True when the caller has a paid purchase of this game.
        in_library:
          type: boolean
          description: |
            True when the caller released this game, or has a paid, refunded,
            or disputed purchase of it.
        rating_average:
          type: ["number", "null"]
          description: Mean of submitted ratings, rounded to one decimal. Null when nobody has rated the game.
        rating_count:
          type: integer
          description: Number of submitted ratings.
        my_rating:
          type: ["integer", "null"]
          description: The signed-in caller's rating, from 1 to 5. Null when they have not rated the game.
        reviews:
          type: array
          description: Newest first. `comment` is empty when that rating has no text.
          items:
            $ref: "#/components/schemas/MarketplaceReview"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    MarketplaceReview:
      type: object
      required: [username, stars, comment]
      properties:
        username:
          type: string
        stars:
          type: integer
          minimum: 1
          maximum: 5
        comment:
          type: string
          maxLength: 500

    MarketplaceRatingWrite:
      type: object
      required: [stars]
      properties:
        stars:
          type: integer
          minimum: 1
          maximum: 5
        comment:
          type: string
          maxLength: 500
          description: Optional. A blank string is a star-only rating.

    MarketplaceListingWrite:
      type: object
      required: [game, price_cents, category]
      properties:
        game:
          type: integer
        price_cents:
          type: integer
          minimum: 0
        category:
          type: string
        description:
          type: string
        tags:
          type: array
          items:
            type: string
        published:
          type: boolean

    MarketplaceListingPatch:
      type: object
      properties:
        price_cents:
          type: integer
          minimum: 0
        category:
          type: string
        description:
          type: string
        tags:
          type: array
          items:
            type: string
        published:
          type: boolean

    PaginatedListings:
      allOf:
        - $ref: "#/components/schemas/Paginated"
        - type: object
          properties:
            results:
              type: array
              items:
                $ref: "#/components/schemas/MarketplaceListing"

    MarketplacePurchase:
      type: object
      required:
        - id
        - status
        - title
        - price_cents
        - currency
        - platform_fee_cents
        - processing_estimate_cents
        - creator_credit_cents
        - seller
        - buyer
        - created_at
      properties:
        id:
          type: integer
        status:
          type: string
          enum: [pending, paid, refunded, disputed, canceled, failed]
        title:
          type: string
        price_cents:
          type: integer
        currency:
          type: string
        platform_fee_cents:
          type: integer
          description: 20% of the price, in cents.
        processing_estimate_cents:
          type: integer
          description: |
            Cents retained for the operator's card-processing estimate
            (configured basis points plus the configured fixed amount).
        creator_credit_cents:
          type: integer
          description: Price minus the 20% fee minus the configured processing estimate.
        seller:
          type: string
        buyer:
          type: string
        cover:
          type: string
        listing_slug:
          type: string
        game_id:
          type: ["integer", "null"]
        paid_at:
          type: ["string", "null"]
          format: date-time
        available_at:
          type: ["string", "null"]
          format: date-time
        created_at:
          type: string
          format: date-time

    PaginatedPurchases:
      allOf:
        - $ref: "#/components/schemas/Paginated"
        - type: object
          properties:
            results:
              type: array
              items:
                $ref: "#/components/schemas/MarketplacePurchase"

    MarketplaceCheckout:
      type: object
      required: [free, checkout_url, session_id, purchase]
      properties:
        free:
          type: boolean
        checkout_url:
          type: string
        session_id:
          type: string
        purchase:
          $ref: "#/components/schemas/MarketplacePurchase"

    MarketplaceAccount:
      type: object
      required: [stripe_account_id, transfers_status, payouts_status, ready]
      properties:
        stripe_account_id:
          type: string
        transfers_status:
          type: string
          description: "`configuration.recipient.capabilities.stripe_balance.stripe_transfers.status`."
        payouts_status:
          type: string
          description: "`configuration.recipient.capabilities.stripe_balance.payouts.status`."
        ready:
          type: boolean

    MarketplaceBalance:
      type: object
      required: [held_cents, available_cents, paid_out_cents, min_payout_cents, hold_days]
      properties:
        held_cents:
          type: integer
        available_cents:
          type: integer
        paid_out_cents:
          type: integer
        min_payout_cents:
          type: integer
        hold_days:
          type: integer

    MarketplacePayoutResult:
      type: object
      required: [transferred, amount_cents, payout_id, blocked_reason, balance]
      properties:
        transferred:
          type: boolean
        amount_cents:
          type: integer
        payout_id:
          type: ["integer", "null"]
        blocked_reason:
          type: string
        balance:
          $ref: "#/components/schemas/MarketplaceBalance"

    MarketplaceSellerGame:
      type: object
      required: [id, title, slug, listing_slug]
      properties:
        id:
          type: integer
        title:
          type: string
        slug:
          type: string
        listing_slug:
          type: string
          description: Empty when this released game is not listed.

    MarketplaceSales:
      type: object
      required: [balance, payout, account, listings, games, sales]
      properties:
        balance:
          $ref: "#/components/schemas/MarketplaceBalance"
        payout:
          type: object
          required: [transferred, amount_cents, payout_id, blocked_reason]
          properties:
            transferred:
              type: boolean
            amount_cents:
              type: integer
            payout_id:
              type: ["integer", "null"]
            blocked_reason:
              type: string
        account:
          $ref: "#/components/schemas/MarketplaceAccount"
        listings:
          type: array
          items:
            $ref: "#/components/schemas/MarketplaceListing"
        games:
          type: array
          items:
            $ref: "#/components/schemas/MarketplaceSellerGame"
        sales:
          type: array
          items:
            $ref: "#/components/schemas/MarketplacePurchase"

    MarketplaceAccountSession:
      type: object
      required: [client_secret, publishable_key, components]
      properties:
        client_secret:
          type: string
        publishable_key:
          type: string
        components:
          type: array
          items:
            type: string
