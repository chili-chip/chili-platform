openapi: 3.1.0
info:
  title: Chili Platform API
  version: 0.1.0
  summary: Serverless Django API for Chili Platform.
  description: |
    JWT-authenticated API for Chili Platform. Django runs on Cloudflare Workers
    with D1 (SQLite at the edge) and R2 for uploaded media.

    **Auth:** send `Authorization: Bearer <access>` after registering or
    exchanging credentials at `/api/auth/token/`. Access tokens last 30 minutes;
    refresh tokens last 14 days.

    **List endpoints** from the games, forum, store, and marketplace routers are
    paginated (`page`, 20 per page) unless noted. Nested post comments, marketplace
    categories, and marketplace tags are returned as a raw array.

    **Games** are Bitsy projects from the creator. Anyone can list and read
    them. Signed-in users create games; only the owner can update or delete.
    `PATCH` accepts a PNG data URL for `cover`. The file is stored in R2 (local
    disk in development) and responses return a media URL. Data URLs are not
    stored in D1.

    **Store** sells hardware through Stripe Checkout (test mode). Staff add
    products in Django admin or via the products API. Buyers must be signed in.
    Payment is confirmed by the Stripe webhook and by
    `POST /api/store/checkout/confirm/` when the customer returns from Checkout.
    Kit checkout is unchanged by game sales.

    **Marketplace** lists saved games. A free listing is claimed with no card
    charge. A paid listing costs at least $1 and charges the buyer's card on
    Chili's account (separate charge; no destination and no `application_fee_amount`).
    Chili keeps 20% plus an estimate of card processing and credits the rest to
    the creator. The operator sets that estimate (`MARKETPLACE_PROCESSING_FEE_BPS`
    and `MARKETPLACE_PROCESSING_FEE_FIXED_CENTS`) from https://stripe.com/pricing
    for the charge currency and method. There is no default rate. That balance
    can accrue before payout setup. After a 7-day hold,
    Chili transfers it only when transfers are active and cleared earnings are at
    least $20. Creators have no Stripe dashboard; payout setup is embedded.

    **Ops** routes (`/api/_ops/*`) are for D1 bootstrap. They are gated by
    `X-Ops-Token` and are not part of the public client surface.
  license:
    name: MIT
    identifier: MIT
  contact:
    name: Chili Chip
    url: https://github.com/chili-chip/chili-platform

servers:
  - url: http://localhost:8787
    description: "Local Wrangler (`npm run dev`)"
  - url: "{origin}"
    description: Deployed Worker
    variables:
      origin:
        default: https://chili-platform-api.example.workers.dev

tags:
  - name: Health
    description: Liveness check.
  - name: Auth
    description: Registration and JWT issue/refresh.
  - name: Profiles
    description: Current user and public profiles.
  - name: Games
    description: Bitsy projects. Public read; only the owner can change or delete.
  - name: Forum
    description: Categories, posts, and comments.
  - name: Store
    description: Hardware catalog, Stripe Checkout, and order tracking.
  - name: Marketplace
    description: Game listings, card purchases, and creator payouts.
  - name: Ops
    description: Secret-gated D1 migrate/seed/bootstrap.

security: []

paths:
  /api/health/:
    get:
      tags: [Health]
      operationId: getHealth
      summary: Health check
      description: Public liveness probe. Not paginated.
      responses:
        "200":
          description: Service is up.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
              example:
                status: ok
                service: chili-platform

  /api/auth/register/:
    post:
      tags: [Auth]
      operationId: register
      summary: Register
      description: Create an account and return the user plus a JWT pair.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
            example:
              username: pepper
              email: pepper@chili.example
              password: supersecret
              bio: Handheld builds and spice.
      responses:
        "201":
          description: Account created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSession"
        "400":
          $ref: "#/components/responses/ValidationError"

  /api/auth/token/:
    post:
      tags: [Auth]
      operationId: obtainToken
      summary: Obtain JWT pair
      description: Exchange username and password for access and refresh tokens.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TokenObtainRequest"
            example:
              username: pepper
              password: supersecret
      responses:
        "200":
          description: Tokens issued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenPair"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/auth/token/refresh/:
    post:
      tags: [Auth]
      operationId: refreshToken
      summary: Refresh access token
      description: Issue a new access token from a valid refresh token. Refresh tokens are not rotated.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TokenRefreshRequest"
      responses:
        "200":
          description: New access token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenRefreshResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/profiles/me/:
    get:
      tags: [Profiles]
      operationId: getMe
      summary: Current profile
      security: [{bearerAuth: []}]
      responses:
        "200":
          description: Authenticated user, including email.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
    put:
      tags: [Profiles]
      operationId: replaceMe
      summary: Replace current profile
      description: "Writable fields are `bio` and `avatar_url`. Username and email are read-only."
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileUpdate"
      responses:
        "200":
          description: Updated profile.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
    patch:
      tags: [Profiles]
      operationId: patchMe
      summary: Patch current profile
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileUpdate"
            example:
              bio: Shipping games to the vgc zero.
      responses:
        "200":
          description: Updated profile.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/profiles/{username}/:
    get:
      tags: [Profiles]
      operationId: getPublicProfile
      summary: Public profile
      parameters:
        - $ref: "#/components/parameters/Username"
      responses:
        "200":
          description: Public profile (no email).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicProfile"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/games/:
    get:
      tags: [Games]
      operationId: listGames
      summary: List games
      description: |
        Public. Newest updates first. Pass `username` to list one profile's
        games (the creator and profile page do this). An unknown username
        returns an empty page.
      parameters:
        - $ref: "#/components/parameters/Page"
        - name: username
          in: query
          required: false
          description: Filter to games owned by this username.
          schema:
            type: string
            example: pepper
      responses:
        "200":
          description: Paginated games.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedGames"
    post:
      tags: [Games]
      operationId: createGame
      summary: Create game
      description: |
        Owner is the authenticated user. `slug` is generated from the title.
        `cover` is optional here; the editor usually sets it later with PATCH.
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GameWrite"
            example:
              title: untitled
              data: "# BITSY VERSION 8.0\n"
      responses:
        "201":
          description: Game created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Game"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/games/{id}/:
    parameters:
      - $ref: "#/components/parameters/GameId"
    get:
      tags: [Games]
      operationId: getGame
      summary: Retrieve game
      description: Public, including Bitsy `data`.
      responses:
        "200":
          description: Game.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Game"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [Games]
      operationId: replaceGame
      summary: Replace game
      description: |
        Owner only. Requires `title` and `data`. Omit `cover` to keep the
        current file; sending a PNG data URL replaces it.
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GameWrite"
      responses:
        "200":
          description: Updated game.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Game"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [Games]
      operationId: patchGame
      summary: Patch game
      description: |
        Owner only. The editor sends `{ "cover": "data:image/png;base64,..." }`
        from the play canvas. The PNG is stored in R2 (local disk in development)
        and the response `cover` is a media URL. An empty string clears the cover.
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GamePatch"
            example:
              cover: data:image/png;base64,iVBORw0KGgo=
      responses:
        "200":
          description: Updated game. `cover` is a media URL or an empty string.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Game"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [Games]
      operationId: deleteGame
      summary: Delete game
      description: Owner only. Also deletes the cover file.
      security: [{bearerAuth: []}]
      responses:
        "204":
          description: Deleted.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/forum/:
    get:
      tags: [Forum]
      operationId: getForumIndex
      summary: Forum router index
      description: "DRF DefaultRouter root with hyperlinks to the three collections."
      responses:
        "200":
          description: Collection links.
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: string
                  format: uri
              example:
                categories: http://localhost:8787/api/forum/categories/
                posts: http://localhost:8787/api/forum/posts/
                comments: http://localhost:8787/api/forum/comments/

  /api/forum/categories/:
    get:
      tags: [Forum]
      operationId: listCategories
      summary: List categories
      parameters:
        - $ref: "#/components/parameters/Page"
      responses:
        "200":
          description: Paginated categories.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedCategories"
    post:
      tags: [Forum]
      operationId: createCategory
      summary: Create category
      description: "Staff only. `slug` is generated from `name`."
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CategoryWrite"
            example:
              name: General
              description: Hangouts, intros, and off-topic chili talk.
      responses:
        "201":
          description: Category created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ForumCategory"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/forum/categories/{slug}/:
    parameters:
      - $ref: "#/components/parameters/CategorySlug"
    get:
      tags: [Forum]
      operationId: getCategory
      summary: Retrieve category
      responses:
        "200":
          description: Category.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ForumCategory"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [Forum]
      operationId: replaceCategory
      summary: Replace category
      description: Staff only.
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CategoryWrite"
      responses:
        "200":
          description: Updated category.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ForumCategory"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [Forum]
      operationId: patchCategory
      summary: Patch category
      description: Staff only.
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CategoryWrite"
      responses:
        "200":
          description: Updated category.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ForumCategory"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [Forum]
      operationId: deleteCategory
      summary: Delete category
      description: Staff only. Categories with posts are protected by the FK.
      security: [{bearerAuth: []}]
      responses:
        "204":
          description: Deleted.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/forum/posts/:
    get:
      tags: [Forum]
      operationId: listPosts
      summary: List posts
      parameters:
        - $ref: "#/components/parameters/Page"
        - name: category
          in: query
          required: false
          description: Filter by category slug.
          schema:
            type: string
            example: game-dev
      responses:
        "200":
          description: Paginated posts.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedPosts"
    post:
      tags: [Forum]
      operationId: createPost
      summary: Create post
      description: "Author is the authenticated user. `slug` is generated from the title."
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PostWrite"
            example:
              title: First chili handheld build
              content: Shell, buttons, and a Chilichip kit.
              category: 1
      responses:
        "201":
          description: Post created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ForumPost"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/forum/posts/{id}/:
    parameters:
      - $ref: "#/components/parameters/PostId"
    get:
      tags: [Forum]
      operationId: getPost
      summary: Retrieve post
      responses:
        "200":
          description: Post.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ForumPost"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [Forum]
      operationId: replacePost
      summary: Replace post
      description: Author or staff.
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PostWrite"
      responses:
        "200":
          description: Updated post.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ForumPost"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [Forum]
      operationId: patchPost
      summary: Patch post
      description: Author or staff.
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PostWrite"
      responses:
        "200":
          description: Updated post.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ForumPost"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [Forum]
      operationId: deletePost
      summary: Delete post
      description: Author or staff.
      security: [{bearerAuth: []}]
      responses:
        "204":
          description: Deleted.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/forum/posts/{id}/comments/:
    parameters:
      - $ref: "#/components/parameters/PostId"
    get:
      tags: [Forum]
      operationId: listPostComments
      summary: List comments on a post
      description: Returns a raw array (not the paginated envelope).
      responses:
        "200":
          description: Comments oldest-first.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ForumComment"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      tags: [Forum]
      operationId: createPostComment
      summary: Comment on a post
      description: "`post` is taken from the URL. JWT required."
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommentNestedWrite"
            example:
              content: Nice shell choice.
      responses:
        "201":
          description: Comment created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ForumComment"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/forum/comments/:
    get:
      tags: [Forum]
      operationId: listComments
      summary: List comments
      parameters:
        - $ref: "#/components/parameters/Page"
      responses:
        "200":
          description: Paginated comments.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedComments"
    post:
      tags: [Forum]
      operationId: createComment
      summary: Create comment
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommentWrite"
            example:
              post: 1
              content: Nice shell choice.
      responses:
        "201":
          description: Comment created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ForumComment"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/forum/comments/{id}/:
    parameters:
      - $ref: "#/components/parameters/CommentId"
    get:
      tags: [Forum]
      operationId: getComment
      summary: Retrieve comment
      responses:
        "200":
          description: Comment.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ForumComment"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [Forum]
      operationId: replaceComment
      summary: Replace comment
      description: Author or staff.
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommentWrite"
      responses:
        "200":
          description: Updated comment.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ForumComment"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [Forum]
      operationId: patchComment
      summary: Patch comment
      description: Author or staff.
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommentWrite"
      responses:
        "200":
          description: Updated comment.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ForumComment"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [Forum]
      operationId: deleteComment
      summary: Delete comment
      description: Author or staff.
      security: [{bearerAuth: []}]
      responses:
        "204":
          description: Deleted.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/store/:
    get:
      tags: [Store]
      operationId: getStoreIndex
      summary: Store router index
      description: "DRF DefaultRouter root with hyperlinks to products and orders."
      responses:
        "200":
          description: Collection links.
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: string
                  format: uri
              example:
                products: http://localhost:8787/api/store/products/
                orders: http://localhost:8787/api/store/orders/

  /api/store/products/:
    get:
      tags: [Store]
      operationId: listProducts
      summary: List products
      description: Public catalog of active products. Staff also see inactive rows.
      parameters:
        - $ref: "#/components/parameters/Page"
      responses:
        "200":
          description: Paginated products.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedProducts"
    post:
      tags: [Store]
      operationId: createProduct
      summary: Create product
      description: "Staff only. `slug` is generated from `name`."
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductWrite"
            example:
              name: Chilichip Kit
              short_description: Handheld kit - board, buttons, and a starter shell.
              long_description: |
                The **Chilichip Kit** is the full starter pack for the vgc zero.
              sku: CHIP-KIT
              price_cents: 4999
              stock: 25
              is_active: true
      responses:
        "201":
          description: Product created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/store/products/{slug}/:
    parameters:
      - $ref: "#/components/parameters/ProductSlug"
    get:
      tags: [Store]
      operationId: getProduct
      summary: Retrieve product
      responses:
        "200":
          description: Product.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [Store]
      operationId: replaceProduct
      summary: Replace product
      description: Staff only.
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductWrite"
      responses:
        "200":
          description: Updated product.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [Store]
      operationId: patchProduct
      summary: Patch product
      description: Staff only.
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductWrite"
      responses:
        "200":
          description: Updated product.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [Store]
      operationId: deleteProduct
      summary: Delete product
      description: Staff only. Products referenced by orders are protected by the FK.
      security: [{bearerAuth: []}]
      responses:
        "204":
          description: Deleted.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/store/checkout/:
    post:
      tags: [Store]
      operationId: createCheckout
      summary: Start Stripe Checkout
      description: |
        JWT required. Creates a pending order, reserves stock, and returns a
        Stripe-hosted Checkout URL. Prices are taken from the catalog (not the
        request). Stripe collects a shipping address. Omit `payment_method_types`
        so Checkout can pick methods dynamically.
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CheckoutRequest"
            example:
              items:
                - product: 1
                  quantity: 1
      responses:
        "201":
          description: Checkout session created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckoutSession"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "502":
          description: Stripe request failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDetail"
        "503":
          description: Stripe is not configured.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDetail"

  /api/store/checkout/confirm/:
    post:
      tags: [Store]
      operationId: confirmCheckout
      summary: Sync Checkout Session
      description: |
        JWT required. Retrieves the Stripe session and marks the caller's order
        paid (or canceled) if Checkout already finished. Use this from the
        success URL so the order updates even if the webhook is delayed.
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CheckoutConfirm"
            example:
              session_id: cs_test_123
      responses:
        "200":
          description: Order after sync.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/store/orders/:
    get:
      tags: [Store]
      operationId: listOrders
      summary: List my orders
      security: [{bearerAuth: []}]
      parameters:
        - $ref: "#/components/parameters/Page"
      responses:
        "200":
          description: Paginated orders for the authenticated user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedOrders"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/store/orders/{id}/:
    parameters:
      - $ref: "#/components/parameters/OrderId"
    get:
      tags: [Store]
      operationId: getOrder
      summary: Retrieve my order
      security: [{bearerAuth: []}]
      responses:
        "200":
          description: Order.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/store/stripe/webhook/:
    post:
      tags: [Store]
      operationId: stripeWebhook
      summary: Stripe webhook
      description: |
        Verifies `Stripe-Signature` with `STRIPE_WEBHOOK_SECRET`. Kit checkout
        handles `checkout.session.completed`, `checkout.session.async_payment_succeeded`,
        `checkout.session.async_payment_failed`, and `checkout.session.expired`.
        Paid sessions mark the order paid and keep reserved stock. Expired or
        failed sessions restore stock. The same signed endpoint also confirms
        game purchases (`metadata.kind=marketplace_purchase`), applies
        `charge.refunded` and `charge.dispute.*` to creator earnings, and
        refreshes a creator account when the event names one.
      responses:
        "200":
          description: Event accepted.
          content:
            application/json:
              schema:
                type: object
                required: [received]
                properties:
                  received:
                    type: boolean
                    example: true
        "400":
          $ref: "#/components/responses/ValidationError"

  /api/_ops/migrate/:
    post:
      tags: [Ops]
      operationId: opsMigrate
      summary: Migrate D1
      description: "Run `migrate` against the Worker D1 database."
      security: [{opsToken: []}]
      responses:
        "200":
          description: Schema applied.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpsStatus"
              example:
                status: migrated
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/_ops/seed/:
    post:
      tags: [Ops]
      operationId: opsSeed
      summary: Seed forum categories and store products
      security: [{opsToken: []}]
      responses:
        "200":
          description: Seed command ran.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpsStatus"
              example:
                status: seeded
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/_ops/bootstrap/:
    post:
      tags: [Ops]
      operationId: opsBootstrap
      summary: Migrate, seed, and ensure admin
      description: |
        Migrates D1, seeds forum categories and store products, and upserts the
        staff user from `ADMIN_USERNAME` / `ADMIN_EMAIL` / `ADMIN_PASSWORD`.
        Skips admin creation when `ADMIN_PASSWORD` is empty.
      security: [{opsToken: []}]
      responses:
        "200":
          description: Bootstrap finished.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BootstrapStatus"
              example:
                status: bootstrapped
                admin:
                  username: admin
                  created: true
                  skipped: false
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/marketplace/config/:
    get:
      tags: [Marketplace]
      operationId: getMarketplaceConfig
      summary: Marketplace pricing config
      description: |
        Public. Paid minimum, payout minimum, hold, the 20% fee, the operator's
        card-processing estimate, and the Stripe publishable key used by embedded
        payout components. The estimate is null until
        `MARKETPLACE_PROCESSING_FEE_BPS` and `MARKETPLACE_PROCESSING_FEE_FIXED_CENTS`
        are set from https://stripe.com/pricing for the charge currency and method.
      responses:
        "200":
          description: Marketplace config.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarketplaceConfig"

  /api/marketplace/categories/:
    get:
      tags: [Marketplace]
      operationId: listMarketplaceCategories
      summary: List marketplace categories
      description: Public. Not paginated. Seeded with the library genres.
      responses:
        "200":
          description: Categories.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MarketplaceCategory"

  /api/marketplace/tags/:
    get:
      tags: [Marketplace]
      operationId: listMarketplaceTags
      summary: Popular listing tags
      description: Public. Not paginated. Counts only published listings.
      responses:
        "200":
          description: Tags.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MarketplaceTag"

  /api/marketplace/listings/:
    get:
      tags: [Marketplace]
      operationId: listMarketplaceListings
      summary: Search published listings
      description: |
        Public browse. Filters: `q` (title, description, creator, tag),
        `category` (slug), `tag`, `price` (`free` or `paid`), and
        `sort` (`new`, `price_asc`, `price_desc`, `title`).
      parameters:
        - $ref: "#/components/parameters/Page"
        - name: q
          in: query
          schema:
            type: string
        - name: category
          in: query
          schema:
            type: string
        - name: tag
          in: query
          schema:
            type: string
        - name: price
          in: query
          schema:
            type: string
            enum: [free, paid]
        - name: sort
          in: query
          schema:
            type: string
            enum: [new, price_asc, price_desc, title]
      responses:
        "200":
          description: Paginated listings.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedListings"
    post:
      tags: [Marketplace]
      operationId: createMarketplaceListing
      summary: List a saved game
      description: |
        The authenticated user must own the game. `price_cents` is `0` for a
        free listing or at least `100` ($1). No payout account is required.
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MarketplaceListingWrite"
            example:
              game: 1
              price_cents: 500
              category: puzzle
              description: A tiny maze.
              tags: [bitsy, maze]
      responses:
        "201":
          description: Listing created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarketplaceListing"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/marketplace/listings/{slug}/:
    parameters:
      - name: slug
        in: path
        required: true
        schema:
          type: string
    get:
      tags: [Marketplace]
      operationId: getMarketplaceListing
      summary: Game page
      description: Public when the listing is published. The owner can read an unpublished listing.
      responses:
        "200":
          description: Listing.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarketplaceListing"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [Marketplace]
      operationId: updateMarketplaceListing
      summary: Update a listing
      description: Owner only. Price, category, tags, description, and published.
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MarketplaceListingPatch"
      responses:
        "200":
          description: Updated listing.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarketplaceListing"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    delete:
      tags: [Marketplace]
      operationId: deleteMarketplaceListing
      summary: Unlist a game
      description: |
        Deletes the listing when nobody has bought it. Otherwise it is unpublished
        and the body is the listing.
      security: [{bearerAuth: []}]
      responses:
        "200":
          description: Unpublished because purchases exist.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarketplaceListing"
        "204":
          description: Listing deleted.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/marketplace/listings/{slug}/checkout/:
    parameters:
      - name: slug
        in: path
        required: true
        schema:
          type: string
    post:
      tags: [Marketplace]
      operationId: checkoutMarketplaceListing
      summary: Buy or claim a game
      description: |
        Free listings return a paid purchase and no Checkout URL. Paid listings
        open a Stripe Checkout Session charged on Chili's account. The charge
        does not set `application_fee_amount`, `transfer_data`, `on_behalf_of`,
        or `destination`.
      security: [{bearerAuth: []}]
      responses:
        "201":
          description: Claimed, or Checkout started.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarketplaceCheckout"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/marketplace/checkout/confirm/:
    post:
      tags: [Marketplace]
      operationId: confirmMarketplaceCheckout
      summary: Confirm a game Checkout Session
      description: |
        Buyer only. Loads the session from Stripe and records the purchase when
        `payment_status` is `paid`. The webhook is the source of truth.
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [session_id]
              properties:
                session_id:
                  type: string
      responses:
        "200":
          description: Purchase.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarketplacePurchase"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/marketplace/library/:
    get:
      tags: [Marketplace]
      operationId: listMarketplaceLibrary
      summary: Buyer library
      description: Paid, refunded, and disputed purchases for the signed-in user. Pending checkouts are omitted.
      security: [{bearerAuth: []}]
      parameters:
        - $ref: "#/components/parameters/Page"
      responses:
        "200":
          description: Paginated purchases.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedPurchases"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/marketplace/me/:
    get:
      tags: [Marketplace]
      operationId: getMarketplaceSales
      summary: Creator sales
      description: |
        Listings, unsold games, recent sales, balance, and payout status.
        Also attempts a payout when the hold has passed, transfers are active,
        and cleared earnings are at least $20.
      security: [{bearerAuth: []}]
      responses:
        "200":
          description: Sales desk.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarketplaceSales"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/marketplace/me/account/:
    get:
      tags: [Marketplace]
      operationId: getMarketplaceAccount
      summary: Refresh payout account status
      description: |
        Re-reads `configuration.recipient.capabilities.stripe_balance` from
        Accounts v2. Does not use `charges_enabled` or `payouts_enabled`.
      security: [{bearerAuth: []}]
      responses:
        "200":
          description: Account status. Empty ids when payout setup has not started.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarketplaceAccount"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [Marketplace]
      operationId: createMarketplaceAccount
      summary: Start payout setup
      description: |
        Creates an Accounts v2 recipient (`dashboard: none`, platform fees and
        losses, `stripe_transfers` requested) the first time the creator asks
        to be paid. Later calls refresh the same account.
      security: [{bearerAuth: []}]
      responses:
        "201":
          description: Connected account.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarketplaceAccount"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/marketplace/me/account-session/:
    post:
      tags: [Marketplace]
      operationId: createMarketplaceAccountSession
      summary: Embedded payout session
      description: |
        Account Session for `account_onboarding`, `notification_banner`,
        `account_management`, and `payouts`. Stripe user authentication is
        disabled so the creator stays on Chili. Requires an account.
      security: [{bearerAuth: []}]
      responses:
        "200":
          description: Client secret for Connect.js.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarketplaceAccountSession"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/marketplace/me/payouts/:
    post:
      tags: [Marketplace]
      operationId: createMarketplacePayout
      summary: Transfer cleared earnings
      description: |
        Transfers the cleared balance to the creator when `stripe_transfers`
        and `payouts` are `active` and the balance is at least $20. Otherwise
        `transferred` is false and `blocked_reason` explains why. The transfer
        amount is the creator credit, which is less than the card charge.
      security: [{bearerAuth: []}]
      responses:
        "200":
          description: Payout attempt.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarketplacePayoutResult"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/marketplace/purchases/{id}/refund/:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
    post:
      tags: [Marketplace]
      operationId: refundMarketplacePurchase
      summary: Refund a game purchase
      description: |
        Staff only. Refunds the card charge on Chili's account, then reduces
        unpaid creator earnings or reverses a transfer already sent.
      security: [{bearerAuth: []}]
      responses:
        "200":
          description: Refunded purchase.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarketplacePurchase"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: "Access token from `/api/auth/token/` or `/api/auth/register/`."
    opsToken:
      type: apiKey
      in: header
      name: X-Ops-Token
      description: "Must match the Worker `OPS_TOKEN` (dev default `chili-dev-ops-token`)."

  parameters:
    Username:
      name: username
      in: path
      required: true
      schema:
        type: string
        maxLength: 150
        example: pepper
    CategorySlug:
      name: slug
      in: path
      required: true
      schema:
        type: string
        maxLength: 80
        example: general
    PostId:
      name: id
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    CommentId:
      name: id
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    ProductSlug:
      name: slug
      in: path
      required: true
      schema:
        type: string
        maxLength: 140
        example: chilichip-kit
    OrderId:
      name: id
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    GameId:
      name: id
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    Page:
      name: page
      in: query
      required: false
      description: 1-based page number. Page size is 20.
      schema:
        type: integer
        minimum: 1
        default: 1

  responses:
    ValidationError:
      description: Request failed serializer validation.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ValidationError"
    Unauthorized:
      description: Missing, invalid, or insufficient credentials.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorDetail"
          examples:
            jwt:
              value:
                detail: Authentication credentials were not provided.
            ops:
              value:
                detail: Unauthorized.
    Forbidden:
      description: Authenticated but not allowed (not staff / not author).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorDetail"
          example:
            detail: You do not have permission to perform this action.
    NotFound:
      description: Object does not exist.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorDetail"
          example:
            detail: Not found.

  schemas:
    Health:
      type: object
      required: [status, service]
      properties:
        status:
          type: string
          example: ok
        service:
          type: string
          example: chili-platform

    ErrorDetail:
      type: object
      required: [detail]
      properties:
        detail:
          description: DRF may return a string or a nested error structure.
          oneOf:
            - type: string
            - type: object
              additionalProperties: true

    ValidationError:
      type: object
      additionalProperties:
        type: array
        items:
          type: string
      example:
        password:
          - This field is required.
        email:
          - Enter a valid email address.

    RegisterRequest:
      type: object
      required: [username, email, password]
      properties:
        username:
          type: string
          maxLength: 150
        email:
          type: string
          format: email
        password:
          type: string
          format: password
          minLength: 8
          writeOnly: true
        bio:
          type: string
          maxLength: 500
          default: ""
        avatar_url:
          type: string
          format: uri
          maxLength: 200
          default: ""

    User:
      type: object
      required: [id, username, email, avatar_url, bio, created_at]
      properties:
        id:
          type: integer
          readOnly: true
        username:
          type: string
          readOnly: true
        email:
          type: string
          format: email
          readOnly: true
        avatar_url:
          type: string
        bio:
          type: string
          maxLength: 500
        created_at:
          type: string
          format: date-time
          readOnly: true

    PublicProfile:
      type: object
      required: [id, username, avatar_url, bio, created_at]
      properties:
        id:
          type: integer
        username:
          type: string
        avatar_url:
          type: string
        bio:
          type: string
        created_at:
          type: string
          format: date-time

    ProfileUpdate:
      type: object
      properties:
        bio:
          type: string
          maxLength: 500
        avatar_url:
          type: string
          format: uri
          maxLength: 200

    AuthSession:
      type: object
      required: [user, access, refresh]
      properties:
        user:
          $ref: "#/components/schemas/User"
        access:
          type: string
        refresh:
          type: string

    TokenObtainRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string
          format: password

    TokenPair:
      type: object
      required: [access, refresh]
      properties:
        access:
          type: string
        refresh:
          type: string

    TokenRefreshRequest:
      type: object
      required: [refresh]
      properties:
        refresh:
          type: string

    TokenRefreshResponse:
      type: object
      required: [access]
      properties:
        access:
          type: string

    AuthorSnippet:
      type: object
      required: [id, username, avatar_url]
      properties:
        id:
          type: integer
        username:
          type: string
        avatar_url:
          type: string

    ForumCategory:
      type: object
      required: [id, name, slug, description, post_count]
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 80
        slug:
          type: string
          maxLength: 80
          readOnly: true
        description:
          type: string
        post_count:
          type: integer
          readOnly: true

    CategoryWrite:
      type: object
      required: [name]
      properties:
        name:
          type: string
          maxLength: 80
        description:
          type: string
          default: ""

    ForumPost:
      type: object
      required:
        - id
        - title
        - slug
        - content
        - author
        - category
        - category_detail
        - comment_count
        - created_at
      properties:
        id:
          type: integer
          readOnly: true
        title:
          type: string
          maxLength: 160
        slug:
          type: string
          maxLength: 180
          readOnly: true
        content:
          type: string
        author:
          $ref: "#/components/schemas/AuthorSnippet"
        category:
          type: integer
          description: Category primary key.
        category_detail:
          $ref: "#/components/schemas/ForumCategory"
        comment_count:
          type: integer
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true

    PostWrite:
      type: object
      required: [title, content, category]
      properties:
        title:
          type: string
          maxLength: 160
        content:
          type: string
        category:
          type: integer
          description: Category primary key.

    ForumComment:
      type: object
      required: [id, post, author, content, created_at]
      properties:
        id:
          type: integer
          readOnly: true
        post:
          type: integer
        author:
          $ref: "#/components/schemas/AuthorSnippet"
        content:
          type: string
        created_at:
          type: string
          format: date-time
          readOnly: true

    CommentWrite:
      type: object
      required: [post, content]
      properties:
        post:
          type: integer
        content:
          type: string

    CommentNestedWrite:
      type: object
      required: [content]
      properties:
        content:
          type: string

    PaginatedCategories:
      allOf:
        - $ref: "#/components/schemas/Paginated"
        - type: object
          properties:
            results:
              type: array
              items:
                $ref: "#/components/schemas/ForumCategory"

    PaginatedPosts:
      allOf:
        - $ref: "#/components/schemas/Paginated"
        - type: object
          properties:
            results:
              type: array
              items:
                $ref: "#/components/schemas/ForumPost"

    PaginatedComments:
      allOf:
        - $ref: "#/components/schemas/Paginated"
        - type: object
          properties:
            results:
              type: array
              items:
                $ref: "#/components/schemas/ForumComment"

    Game:
      type: object
      required:
        - id
        - title
        - slug
        - owner
        - cover
        - data
        - created_at
        - updated_at
      properties:
        id:
          type: integer
          readOnly: true
        title:
          type: string
          maxLength: 160
        slug:
          type: string
          maxLength: 180
          readOnly: true
        owner:
          type: string
          readOnly: true
          description: Username of the account that saved the game.
          example: pepper
        cover:
          type: string
          readOnly: true
          description: |
            Absolute media URL of the PNG cover, or an empty string when none
            is set. This is never a data URL.
          example: http://localhost:8787/media/games/covers/1/abc.png
        data:
          type: string
          description: Bitsy game source (`serializeWorld`).
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true

    GameWrite:
      type: object
      required: [title, data]
      properties:
        title:
          type: string
          maxLength: 160
        data:
          type: string
          description: Bitsy game source. 1.5 MB max.
        cover:
          type: string
          description: |
            Optional PNG data URL (`data:image/png;base64,...`). Omit it on
            PUT to keep the current cover. The stored value is a media URL.

    GamePatch:
      type: object
      description: Any subset of writable game fields. The editor sends `cover` alone.
      properties:
        title:
          type: string
          maxLength: 160
        data:
          type: string
          description: Bitsy game source. 1.5 MB max.
        cover:
          type: string
          description: |
            PNG data URL (`data:image/png;base64,...`), 8 MB max decoded.
            Empty string removes the cover. Responses return a media URL.

    PaginatedGames:
      allOf:
        - $ref: "#/components/schemas/Paginated"
        - type: object
          properties:
            results:
              type: array
              items:
                $ref: "#/components/schemas/Game"

    Product:
      type: object
      required:
        - id
        - name
        - slug
        - short_description
        - long_description
        - sku
        - price_cents
        - currency
        - image_url
        - images
        - stock
        - is_active
        - created_at
        - updated_at
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 120
        slug:
          type: string
          maxLength: 140
          readOnly: true
        short_description:
          type: string
          maxLength: 280
        long_description:
          type: string
          description: Markdown product copy shown on the product page.
        sku:
          type: string
          maxLength: 40
        price_cents:
          type: integer
          minimum: 1
          description: Unit price in the smallest currency unit (cents for USD).
        currency:
          type: string
          minLength: 3
          maxLength: 3
          default: usd
        images:
          type: array
          readOnly: true
          items:
            $ref: "#/components/schemas/ProductImage"
        image_url:
          type: string
          readOnly: true
          description: Cover picture URL (first image), empty when none are uploaded.
        stock:
          type: integer
          minimum: 0
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true

    ProductWrite:
      type: object
      required: [name, price_cents]
      properties:
        name:
          type: string
          maxLength: 120
        short_description:
          type: string
          maxLength: 280
          default: ""
        long_description:
          type: string
          default: ""
          description: Markdown product copy shown on the product page.
        sku:
          type: string
          maxLength: 40
          default: ""
        price_cents:
          type: integer
          minimum: 1
        currency:
          type: string
          minLength: 3
          maxLength: 3
          default: usd
        stock:
          type: integer
          minimum: 0
          default: 0
        is_active:
          type: boolean
          default: true

    ProductImage:
      type: object
      required: [id, url, alt, sort_order]
      properties:
        id:
          type: integer
          readOnly: true
        url:
          type: string
          format: uri
        alt:
          type: string
        sort_order:
          type: integer

    CheckoutItem:
      type: object
      required: [product, quantity]
      properties:
        product:
          type: integer
          description: Product primary key.
        quantity:
          type: integer
          minimum: 1
          maximum: 99

    CheckoutRequest:
      type: object
      required: [items]
      properties:
        items:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/CheckoutItem"

    CheckoutConfirm:
      type: object
      required: [session_id]
      properties:
        session_id:
          type: string
          example: cs_test_123

    CheckoutSession:
      type: object
      required: [checkout_url, session_id, order]
      properties:
        checkout_url:
          type: string
          format: uri
        session_id:
          type: string
        order:
          $ref: "#/components/schemas/Order"

    OrderItem:
      type: object
      required:
        - id
        - product
        - product_name
        - unit_price_cents
        - quantity
        - line_total_cents
      properties:
        id:
          type: integer
        product:
          type: integer
        product_name:
          type: string
        unit_price_cents:
          type: integer
        quantity:
          type: integer
        line_total_cents:
          type: integer
          readOnly: true

    Order:
      type: object
      required:
        - id
        - status
        - currency
        - total_cents
        - items
        - created_at
        - updated_at
      properties:
        id:
          type: integer
          readOnly: true
        status:
          type: string
          enum: [pending, paid, canceled, failed, fulfilled]
        currency:
          type: string
        total_cents:
          type: integer
        stripe_checkout_session_id:
          type: ["string", "null"]
        customer_email:
          type: string
        shipping_name:
          type: string
        shipping_line1:
          type: string
        shipping_line2:
          type: string
        shipping_city:
          type: string
        shipping_state:
          type: string
        shipping_postal_code:
          type: string
        shipping_country:
          type: string
        items:
          type: array
          items:
            $ref: "#/components/schemas/OrderItem"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        paid_at:
          type: ["string", "null"]
          format: date-time

    PaginatedProducts:
      allOf:
        - $ref: "#/components/schemas/Paginated"
        - type: object
          properties:
            results:
              type: array
              items:
                $ref: "#/components/schemas/Product"

    PaginatedOrders:
      allOf:
        - $ref: "#/components/schemas/Paginated"
        - type: object
          properties:
            results:
              type: array
              items:
                $ref: "#/components/schemas/Order"

    Paginated:
      type: object
      required: [count, next, previous, results]
      properties:
        count:
          type: integer
        next:
          type: ["string", "null"]
          format: uri
        previous:
          type: ["string", "null"]
          format: uri
        results:
          type: array
          items: {}

    OpsStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string

    BootstrapStatus:
      type: object
      required: [status, admin]
      properties:
        status:
          type: string
          example: bootstrapped
        admin:
          type: object
          required: [username, created, skipped]
          properties:
            username:
              type: string
            created:
              type: boolean
            skipped:
              type: boolean
              description: "True when `ADMIN_PASSWORD` is empty."
    MarketplaceConfig:
      type: object
      required:
        - currency
        - min_paid_cents
        - min_payout_cents
        - hold_days
        - platform_fee_bps
        - processing_fee_bps
        - processing_fee_fixed_cents
        - stripe_publishable_key
      properties:
        currency:
          type: string
          example: usd
        min_paid_cents:
          type: integer
          description: Paid listings must cost at least this many cents. Zero is free.
          example: 100
        min_payout_cents:
          type: integer
          example: 2000
        hold_days:
          type: integer
          example: 7
        platform_fee_bps:
          type: integer
          description: Basis points kept by Chili. 2000 is 20%.
          example: 2000
        processing_fee_bps:
          type: ["integer", "null"]
          description: |
            Estimated card percentage in basis points. The operator sets
            `MARKETPLACE_PROCESSING_FEE_BPS` from https://stripe.com/pricing
            for the charge currency and method. Null when unset. There is no
            default rate.
        processing_fee_fixed_cents:
          type: ["integer", "null"]
          description: |
            Estimated fixed card fee in cents, added to the basis-point estimate.
            The operator sets `MARKETPLACE_PROCESSING_FEE_FIXED_CENTS` from
            https://stripe.com/pricing for the charge currency and method.
            Null when unset.
        stripe_publishable_key:
          type: string

    MarketplaceCategory:
      type: object
      required: [id, name, slug, description]
      properties:
        id:
          type: integer
        name:
          type: string
        slug:
          type: string
        description:
          type: string

    MarketplaceTag:
      type: object
      required: [name, count]
      properties:
        name:
          type: string
        count:
          type: integer

    MarketplaceGameCard:
      type: object
      required: [id, title, slug, cover, owner]
      properties:
        id:
          type: integer
        title:
          type: string
        slug:
          type: string
        cover:
          type: string
        owner:
          type: string

    MarketplaceListing:
      type: object
      required:
        - id
        - slug
        - description
        - price_cents
        - currency
        - category
        - tags
        - game
        - published
        - owned
        - created_at
        - updated_at
      properties:
        id:
          type: integer
        slug:
          type: string
        description:
          type: string
        price_cents:
          type: integer
        currency:
          type: string
        category:
          type: object
          required: [slug, name]
          properties:
            slug:
              type: string
            name:
              type: string
        tags:
          type: array
          items:
            type: string
        game:
          $ref: "#/components/schemas/MarketplaceGameCard"
        published:
          type: boolean
        owned:
          type: boolean
          description: True when the caller has a paid purchase of this game.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    MarketplaceListingWrite:
      type: object
      required: [game, price_cents, category]
      properties:
        game:
          type: integer
        price_cents:
          type: integer
          minimum: 0
        category:
          type: string
        description:
          type: string
        tags:
          type: array
          items:
            type: string
        published:
          type: boolean

    MarketplaceListingPatch:
      type: object
      properties:
        price_cents:
          type: integer
          minimum: 0
        category:
          type: string
        description:
          type: string
        tags:
          type: array
          items:
            type: string
        published:
          type: boolean

    PaginatedListings:
      allOf:
        - $ref: "#/components/schemas/Paginated"
        - type: object
          properties:
            results:
              type: array
              items:
                $ref: "#/components/schemas/MarketplaceListing"

    MarketplacePurchase:
      type: object
      required:
        - id
        - status
        - title
        - price_cents
        - currency
        - platform_fee_cents
        - processing_estimate_cents
        - creator_credit_cents
        - seller
        - buyer
        - created_at
      properties:
        id:
          type: integer
        status:
          type: string
          enum: [pending, paid, refunded, disputed, canceled, failed]
        title:
          type: string
        price_cents:
          type: integer
        currency:
          type: string
        platform_fee_cents:
          type: integer
          description: 20% of the price, in cents.
        processing_estimate_cents:
          type: integer
          description: |
            Cents retained for the operator's card-processing estimate
            (configured basis points plus the configured fixed amount).
        creator_credit_cents:
          type: integer
          description: Price minus the 20% fee minus the configured processing estimate.
        seller:
          type: string
        buyer:
          type: string
        cover:
          type: string
        listing_slug:
          type: string
        game_id:
          type: ["integer", "null"]
        paid_at:
          type: ["string", "null"]
          format: date-time
        available_at:
          type: ["string", "null"]
          format: date-time
        created_at:
          type: string
          format: date-time

    PaginatedPurchases:
      allOf:
        - $ref: "#/components/schemas/Paginated"
        - type: object
          properties:
            results:
              type: array
              items:
                $ref: "#/components/schemas/MarketplacePurchase"

    MarketplaceCheckout:
      type: object
      required: [free, checkout_url, session_id, purchase]
      properties:
        free:
          type: boolean
        checkout_url:
          type: string
        session_id:
          type: string
        purchase:
          $ref: "#/components/schemas/MarketplacePurchase"

    MarketplaceAccount:
      type: object
      required: [stripe_account_id, transfers_status, payouts_status, ready]
      properties:
        stripe_account_id:
          type: string
        transfers_status:
          type: string
          description: "`configuration.recipient.capabilities.stripe_balance.stripe_transfers.status`."
        payouts_status:
          type: string
          description: "`configuration.recipient.capabilities.stripe_balance.payouts.status`."
        ready:
          type: boolean

    MarketplaceBalance:
      type: object
      required: [held_cents, available_cents, paid_out_cents, min_payout_cents, hold_days]
      properties:
        held_cents:
          type: integer
        available_cents:
          type: integer
        paid_out_cents:
          type: integer
        min_payout_cents:
          type: integer
        hold_days:
          type: integer

    MarketplacePayoutResult:
      type: object
      required: [transferred, amount_cents, payout_id, blocked_reason, balance]
      properties:
        transferred:
          type: boolean
        amount_cents:
          type: integer
        payout_id:
          type: ["integer", "null"]
        blocked_reason:
          type: string
        balance:
          $ref: "#/components/schemas/MarketplaceBalance"

    MarketplaceSellerGame:
      type: object
      required: [id, title, slug, listing_slug]
      properties:
        id:
          type: integer
        title:
          type: string
        slug:
          type: string
        listing_slug:
          type: string

    MarketplaceSales:
      type: object
      required: [balance, payout, account, listings, games, sales]
      properties:
        balance:
          $ref: "#/components/schemas/MarketplaceBalance"
        payout:
          type: object
          required: [transferred, amount_cents, payout_id, blocked_reason]
          properties:
            transferred:
              type: boolean
            amount_cents:
              type: integer
            payout_id:
              type: ["integer", "null"]
            blocked_reason:
              type: string
        account:
          $ref: "#/components/schemas/MarketplaceAccount"
        listings:
          type: array
          items:
            $ref: "#/components/schemas/MarketplaceListing"
        games:
          type: array
          items:
            $ref: "#/components/schemas/MarketplaceSellerGame"
        sales:
          type: array
          items:
            $ref: "#/components/schemas/MarketplacePurchase"

    MarketplaceAccountSession:
      type: object
      required: [client_secret, publishable_key, components]
      properties:
        client_secret:
          type: string
        publishable_key:
          type: string
        components:
          type: array
          items:
            type: string
