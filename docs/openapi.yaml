                  format: uri
              example:
                products: http://localhost:8787/api/store/products/
                orders: http://localhost:8787/api/store/orders/

  /api/store/products/:
    get:
      tags: [Store]
      operationId: listProducts
      summary: List products
      description: |
        Public catalog of active products. Staff also see inactive rows.
        Filters combine with AND. `search` splits on spaces and every word must
        match the name, SKU, short or long copy, or category name.
      parameters:
        - $ref: "#/components/parameters/Page"
        - name: category
          in: query
          description: Category slug, or `none` for products without a category.
          schema:
            type: string
            example: pcbs
        - name: search
          in: query
          schema:
            type: string
            maxLength: 100
            example: rp2350
        - name: min_price_cents
          in: query
          schema:
            type: integer
            minimum: 0
        - name: max_price_cents
          in: query
          schema:
            type: integer
            minimum: 0
        - name: in_stock
          in: query
          description: "`true` hides sold-out products."
          schema:
            type: boolean
        - name: ordering
          in: query
          description: Defaults to name.
          schema:
            type: string
            enum: [name, -name, price, -price, newest]
      responses:
        "200":
          description: Paginated products.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedProducts"
    post:
      tags: [Store]
      operationId: createProduct
      summary: Create product
      description: "Staff only. `slug` is generated from `name`."
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductWrite"
            example:
              name: Chilichip Kit
              short_description: Handheld kit - board, buttons, and a starter shell.
              long_description: |
                The **Chilichip Kit** is the full starter pack for the vgc zero.
              sku: CHIP-KIT
              price_cents: 4999
              stock: 25
              is_active: true
      responses:
        "201":
          description: Product created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

