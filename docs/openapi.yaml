  /api/store/stripe/webhook/:
    post:
      tags: [Store]
      operationId: stripeWebhook
      summary: Stripe webhook
      description: |
        Verifies `Stripe-Signature` with `STRIPE_WEBHOOK_SECRET`. Kit checkout
        handles `checkout.session.completed`, `checkout.session.async_payment_succeeded`,
        `checkout.session.async_payment_failed`, and `checkout.session.expired`.
        Paid sessions mark the order paid and keep reserved stock. Expired or
        failed sessions restore stock. The same signed endpoint also confirms
        game purchases (`metadata.kind=marketplace_purchase`), applies
        `charge.refunded` and `charge.dispute.*` to creator earnings, and
        refreshes a creator account when the event names one.
      responses:
        "200":
          description: Event accepted.
          content:
            application/json:
              schema:
                type: object
                required: [received]
                properties:
                  received:
                    type: boolean
                    example: true
        "400":
          $ref: "#/components/responses/ValidationError"

  /api/_ops/migrate/:
    post:
      tags: [Ops]
      operationId: opsMigrate
      summary: Migrate D1
      description: "Run `migrate` against the Worker D1 database."
      security: [{opsToken: []}]
      responses:
        "200":
          description: Schema applied.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpsStatus"
              example:
                status: migrated
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/_ops/seed/:
    post:
      tags: [Ops]
      operationId: opsSeed
      summary: Seed forum categories and store products
      security: [{opsToken: []}]
      responses:
        "200":
          description: Seed command ran.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpsStatus"
              example:
                status: seeded
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/_ops/bootstrap/:
    post:
      tags: [Ops]
      operationId: opsBootstrap
      summary: Migrate, seed, and ensure admin
      description: |
        Migrates D1, seeds forum categories and store products, and upserts the
        staff user from `ADMIN_USERNAME` / `ADMIN_EMAIL` / `ADMIN_PASSWORD`.
        Skips admin creation when `ADMIN_PASSWORD` is empty.
      security: [{opsToken: []}]
      responses:
        "200":
          description: Bootstrap finished.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BootstrapStatus"
              example:
                status: bootstrapped
                admin:
                  username: admin
                  created: true
                  skipped: false
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/marketplace/config/:
    get:
      tags: [Marketplace]
      operationId: getMarketplaceConfig
      summary: Marketplace pricing config
      description: |
        Public. Paid minimum, payout minimum, hold, the 20% fee, the operator's
        card-processing estimate, and the Stripe publishable key used by embedded
        payout components. The estimate is null until
        `MARKETPLACE_PROCESSING_FEE_BPS` and `MARKETPLACE_PROCESSING_FEE_FIXED_CENTS`
        are set from https://stripe.com/pricing for the charge currency and method.
      responses:
        "200":
          description: Marketplace config.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarketplaceConfig"

  /api/marketplace/categories/:
    get:
      tags: [Marketplace]
      operationId: listMarketplaceCategories
      summary: List marketplace categories
      description: Public. Not paginated. Seeded with the library genres.
      responses:
        "200":
          description: Categories.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MarketplaceCategory"

