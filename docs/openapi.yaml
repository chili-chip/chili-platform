  /api/store/checkout/:
    post:
      tags: [Store]
      operationId: createCheckout
      summary: Start Stripe Checkout
      description: |
        JWT required. Creates a pending order, reserves stock, and returns a
        Stripe-hosted Checkout URL. Prices are taken from the catalog (not the
        request). Stripe collects a shipping address. Omit `payment_method_types`
        so Checkout can pick methods dynamically.
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CheckoutRequest"
            example:
              items:
                - product: 1
                  quantity: 1
      responses:
        "201":
          description: Checkout session created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckoutSession"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "502":
          description: Stripe request failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDetail"
        "503":
          description: Stripe is not configured.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDetail"

  /api/store/checkout/confirm/:
    post:
      tags: [Store]
      operationId: confirmCheckout
      summary: Sync Checkout Session
      description: |
        JWT required. Retrieves the Stripe session and marks the caller's order
        paid (or canceled) if Checkout already finished. Use this from the
        success URL so the order updates even if the webhook is delayed.
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CheckoutConfirm"
            example:
              session_id: cs_test_123
      responses:
        "200":
          description: Order after sync.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"

