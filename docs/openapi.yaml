openapi: 3.1.0
info:
  title: Chili Platform API
  version: 0.1.0
  summary: Serverless Django API for Chili Platform.
  description: |
    JWT-authenticated API for Chili Platform. Django runs on Cloudflare Workers
    with D1 (SQLite at the edge) and R2 for uploaded media.

    **Auth:** send `Authorization: Bearer <access>` after registering or
    exchanging credentials at `/api/auth/token/`. Access tokens last 30 minutes.
    Refresh tokens last 14 days, rotate on use, and the previous refresh token
    is blacklisted. `POST /api/auth/logout/` revokes the current refresh token.
    New accounts are unverified until they open the link in the verification
    email. Until then, forum writes, game create/update, listings, and checkout
    are rejected. Login still works, and registration still returns a JWT pair.

    **List endpoints** from the games, forum, store, and marketplace routers are
    paginated (`page`, 20 per page) unless noted. Nested post comments, marketplace
    categories, and marketplace tags are returned as a raw array.

    **Games** start as private Bitsy projects from the creator. `POST
    /api/games/{id}/release/` turns a project into a released game and keeps
    the Bitsy `data`. Release does not create a marketplace listing. Public
    lists return released games only. Bitsy `data` is returned to the owner
    and to a buyer who has that game in their library. `PATCH` accepts a PNG
    data URL for `cover`. The file is stored in R2 (local disk in development)
    and responses return a media URL. Data URLs are not stored in D1.

    **Store** sells hardware through Stripe Checkout (test mode). Staff add
    products in Django admin or via the products API. Buyers must be signed in.
    Payment is confirmed by the Stripe webhook and by
    `POST /api/store/checkout/confirm/` when the customer returns from Checkout.
    Kit checkout is unchanged by game sales.

    **Marketplace** lists released games. A project cannot be listed. A free listing is claimed with no card
    charge. A paid listing costs at least €1 and charges the buyer's card on
    Chili's account (separate charge; no destination and no `application_fee_amount`).
    Chili keeps 20% plus an estimate of card processing and credits the rest to
    the creator. The operator sets that estimate (`MARKETPLACE_PROCESSING_FEE_BPS`
    and `MARKETPLACE_PROCESSING_FEE_FIXED_CENTS`) from https://stripe.com/pricing
    for the charge currency and method. There is no default rate. That balance
    can accrue before payout setup. After a 7-day hold,
    Chili transfers it only when transfers are active and cleared earnings are at
    least €20. Creators have no Stripe dashboard; payout setup is embedded.
    A signed-in user with the game in their library may submit one rating,
    an integer from 1 to 5, with an optional comment of up to 500 characters.
    There is no edit and no second rating.

    **Ops** routes (`/api/_ops/*`) are for D1 bootstrap. They are gated by
    `X-Ops-Token` and are not part of the public client surface.
  license:
    name: MIT
    identifier: MIT
  contact:
    name: Chili Chip
    url: https://github.com/chili-chip/chili-platform

servers:
  - url: http://localhost:8787
    description: "Local Wrangler (`npm run dev`)"
  - url: "{origin}"
    description: Deployed Worker
    variables:
      origin:
        default: https://chili-platform-api.example.workers.dev

tags:
  - name: Health
    description: Liveness check.
  - name: Auth
    description: Registration and JWT issue/refresh.
  - name: Profiles
    description: Current user and public profiles.
  - name: Games
    description: |
      Bitsy projects and released games. Projects are private. Release keeps
      the Bitsy data and does not list the game. Only the owner can change,
      release, or delete.
  - name: Forum
    description: Categories, posts, and comments.
  - name: Store
    description: Hardware catalog, Stripe Checkout, and order tracking.
  - name: Marketplace
    description: Game listings, card purchases, and creator payouts.
  - name: Ops
    description: Secret-gated D1 migrate/seed/bootstrap.

security: []

paths:
  /api/health/:
    get:
      tags: [Health]
      operationId: getHealth
      summary: Health check
      description: Public liveness probe. Not paginated.
      responses:
        "200":
          description: Service is up.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
              example:
                status: ok
                service: chili-platform

  /api/auth/register/:
    post:
      tags: [Auth]
      operationId: register
      summary: Register
      description: |
        Create an unverified account and return the user plus a JWT pair.
        `accept_terms` must be true. That records acceptance of the terms of
        service and the privacy policy. It does not accept the marketplace
        seller terms. The password is checked with Django's password validators.
        The verification link is emailed. Local development prints that message
        to stdout. The deployed Worker sends it with Cloudflare Email Sending. Missing
        mail settings on the Worker return 503 and do not include a token.
        The response never includes the link.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
            example:
              username: pepper
              email: pepper@chili.example
              password: supersecret
              accept_terms: true
              bio: Handheld builds and spice.
      responses:
        "201":
          description: Account created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSession"
        "400":
          $ref: "#/components/responses/ValidationError"
        "502":
          description: Cloudflare Email Sending rejected the verification message. No token is included.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDetail"
        "503":
          $ref: "#/components/responses/MailNotConfigured"

  /api/auth/token/:
    post:
      tags: [Auth]
      operationId: obtainToken
      summary: Obtain JWT pair
      description: Exchange username and password for access and refresh tokens.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TokenObtainRequest"
            example:
              username: pepper
              password: supersecret
      responses:
        "200":
          description: Tokens issued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenPair"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/auth/token/refresh/:
    post:
      tags: [Auth]
      operationId: refreshToken
      summary: Refresh access token
      description: |
        Issue a new access token and a new refresh token. The refresh token
        sent in the body is blacklisted.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TokenRefreshRequest"
      responses:
        "200":
          description: New access token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenRefreshResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/auth/logout/:
    post:
      tags: [Auth]
      operationId: logout
      summary: Revoke a refresh token
      description: Blacklist the refresh token. The access token is left to expire.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TokenRefreshRequest"
      responses:
        "200":
          description: Refresh token revoked.
          content:
            application/json:
              schema:
                type: object
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/auth/verify-email/:
    post:
      tags: [Auth]
      operationId: verifyEmail
      summary: Verify an email address
      description: Mark the account verified when `uid` and `token` match the link in the email.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UidTokenRequest"
      responses:
        "200":
          description: Email is verified.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDetail"
              example:
                detail: Email verified.
        "400":
          $ref: "#/components/responses/ValidationError"

  /api/auth/verify-email/resend/:
    post:
      tags: [Auth]
      operationId: resendVerification
      summary: Resend the verification email
      description: |
        Send another verification link to the signed-in user. The link is in the
        email, not in this response. Local development prints the message to
        stdout. On the Worker, missing mail settings return 503 and do not
        include a token.
      security: [{bearerAuth: []}]
      responses:
        "200":
          description: Message sent, or the address was already verified.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "502":
          description: Cloudflare Email Sending rejected the message. No token is included.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDetail"
        "503":
          $ref: "#/components/responses/MailNotConfigured"

  /api/auth/password/reset/:
    post:
      tags: [Auth]
      operationId: requestPasswordReset
      summary: Request a password reset
      description: |
        Email a reset link when the address belongs to an account. The response
        does not say whether the account exists and never includes the link.
        Local development prints the message to stdout. On the Worker, missing
        mail settings return 503 and do not include a token.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmailRequest"
      responses:
        "200":
          description: Request accepted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDetail"
        "400":
          $ref: "#/components/responses/ValidationError"
        "502":
          description: Cloudflare Email Sending rejected the message. No token is included.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDetail"
        "503":
          $ref: "#/components/responses/MailNotConfigured"

  /api/auth/password/reset/confirm/:
    post:
      tags: [Auth]
      operationId: confirmPasswordReset
      summary: Set a new password
      description: |
        Set a new password from the reset link. The password is checked with
        Django's password validators. A successful reset also marks the email
        verified, because the link was delivered to that mailbox.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordResetConfirmRequest"
      responses:
        "200":
          description: Password updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDetail"
              example:
                detail: Password updated.
        "400":
          $ref: "#/components/responses/ValidationError"

  /api/auth/email/change/:
    post:
      tags: [Auth]
      operationId: requestEmailChange
      summary: Request an email change
      description: |
        Checks the current password, then emails a confirmation link to the new
        address. The account email does not change until the link is confirmed.
        The link is valid for 24 hours and is never returned in the response.
        Limited to 5 requests an hour per user.
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmailChangeRequest"
      responses:
        "200":
          description: Confirmation email sent to the new address.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDetail"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "502":
          description: Cloudflare Email Sending rejected the message. No token is included.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDetail"
        "503":
          $ref: "#/components/responses/MailNotConfigured"

  /api/auth/email/change/confirm/:
    post:
      tags: [Auth]
      operationId: confirmEmailChange
      summary: Confirm an email change
      description: |
        Apply the change from the emailed link and mark the new email verified.
        The link stops working once used, expired, or if the address was taken
        in the meantime.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmailChangeConfirmRequest"
      responses:
        "200":
          description: Email updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDetail"
        "400":
          $ref: "#/components/responses/ValidationError"

  /api/profiles/me/:
    get:
      tags: [Profiles]
      operationId: getMe
      summary: Current profile
      security: [{bearerAuth: []}]
      responses:
        "200":
          description: Authenticated user, including email.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
    put:
      tags: [Profiles]
      operationId: replaceMe
      summary: Replace current profile
      description: "Writable fields are `bio` and `avatar_url`. Username and email are read-only."
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileUpdate"
      responses:
        "200":
          description: Updated profile.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
    patch:
      tags: [Profiles]
      operationId: patchMe
      summary: Patch current profile
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileUpdate"
            example:
              bio: Shipping games to the vgc zero.
      responses:
        "200":
          description: Updated profile.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/profiles/me/acceptance/:
    post:
      tags: [Profiles]
      operationId: acceptLegalTerms
      summary: Record legal acceptance
      description: |
        Sets `terms_accepted_at` and `privacy_accepted_at` when `terms` is true,
        and `seller_terms_accepted_at` when `seller_terms` is true. A timestamp
        that is already set is left unchanged. Existing accounts are not
        backfilled. Seller terms require the account terms first, unless the
        same request also sends `terms: true`. Profile updates cannot set these
        fields.
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LegalAcceptanceRequest"
            example:
              terms: true
      responses:
        "200":
          description: Current user, including any timestamps just recorded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/profiles/{username}/:
    get:
      tags: [Profiles]
      operationId: getPublicProfile
      summary: Public profile
      parameters:
        - $ref: "#/components/parameters/Username"
      responses:
        "200":
          description: Public profile (no email).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicProfile"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/games/:
    get:
      tags: [Games]
      operationId: listGames
      summary: List games
      description: |
        Newest updates first. Without `released=false`, the list is public
        released games. Pass `username` to list one profile's released games.
        `released=false` returns that signed-in user's projects and is empty
        for everyone else. An unknown username returns an empty page.
      parameters:
        - $ref: "#/components/parameters/Page"
        - name: username
          in: query
          required: false
          description: Filter to games owned by this username.
          schema:
            type: string
            example: pepper
        - name: released
          in: query
          required: false
          description: |
            `false` lists the caller's own projects. Any other value, including
            omitting it, lists released games.
          schema:
            type: string
            default: "true"
            example: "false"
      responses:
        "200":
          description: Paginated games.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedGames"
    post:
      tags: [Games]
      operationId: createGame
      summary: Create game
      description: |
        Owner is the authenticated user. `slug` is generated from the title.
        `cover` is optional here; the editor usually sets it later with PATCH.
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GameWrite"
            example:
              title: untitled
              data: "# BITSY VERSION 8.0\n"
      responses:
        "201":
          description: Game created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Game"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/games/{id}/:
    parameters:
      - $ref: "#/components/parameters/GameId"
    get:
      tags: [Games]
      operationId: getGame
      summary: Retrieve game
      description: |
        Released games are public. Bitsy `data` is included for the owner and
        for a buyer with a paid, refunded, or disputed copy. `in_library` is
        true when the signed-in caller owns the released game or has that copy.
        Projects return 404 unless you own them.
      responses:
        "200":
          description: Game.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Game"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [Games]
      operationId: replaceGame
      summary: Replace game
      description: |
        Owner only. Requires `title` and `data`. Omit `cover` to keep the
        current file; sending a PNG data URL replaces it.
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GameWrite"
      responses:
        "200":
          description: Updated game.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Game"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [Games]
      operationId: patchGame
      summary: Patch game
      description: |
        Owner only. The editor sends `{ "cover": "data:image/png;base64,..." }`
        from the play canvas. The PNG is stored in R2 (local disk in development)
        and the response `cover` is a media URL. An empty string clears the cover.
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GamePatch"
            example:
              cover: data:image/png;base64,iVBORw0KGgo=
      responses:
        "200":
          description: Updated game. `cover` is a media URL or an empty string.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Game"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [Games]
      operationId: deleteGame
      summary: Delete game
      description: Owner only. Also deletes the cover file.
      security: [{bearerAuth: []}]
      responses:
        "204":
          description: Deleted.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/games/{id}/release/:
    post:
      tags: [Games]
      operationId: releaseGame
      summary: Release a project
      description: |
        Owner only. Sets `released` and keeps the Bitsy `data`. Does not create
        a marketplace listing. Repeating the call leaves the released game as it is.
      security: [{bearerAuth: []}]
      parameters:
        - $ref: "#/components/parameters/GameId"
      responses:
        "200":
          description: Released game. `listing_slug` stays empty until a listing is created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Game"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/forum/:
    get:
      tags: [Forum]
      operationId: getForumIndex
      summary: Forum router index
      description: "DRF DefaultRouter root with hyperlinks to the three collections."
      responses:
        "200":
          description: Collection links.
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: string
                  format: uri
              example:
                categories: http://localhost:8787/api/forum/categories/
                posts: http://localhost:8787/api/forum/posts/
                comments: http://localhost:8787/api/forum/comments/

  /api/forum/categories/:
    get:
      tags: [Forum]
      operationId: listCategories
      summary: List categories
      parameters:
        - $ref: "#/components/parameters/Page"
      responses:
        "200":
          description: Paginated categories.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedCategories"
    post:
      tags: [Forum]
      operationId: createCategory
      summary: Create category
      description: "Staff only. `slug` is generated from `name`."
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CategoryWrite"
            example:
              name: General
              description: Hangouts, intros, and off-topic chili talk.
      responses:
        "201":
          description: Category created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ForumCategory"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/forum/categories/{slug}/:
    parameters:
      - $ref: "#/components/parameters/CategorySlug"
    get:
      tags: [Forum]
      operationId: getCategory
      summary: Retrieve category
      responses:
        "200":
          description: Category.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ForumCategory"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [Forum]
      operationId: replaceCategory
      summary: Replace category
      description: Staff only.
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CategoryWrite"
      responses:
        "200":
          description: Updated category.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ForumCategory"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [Forum]
      operationId: patchCategory
      summary: Patch category
      description: Staff only.
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CategoryWrite"
      responses:
        "200":
          description: Updated category.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ForumCategory"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [Forum]
      operationId: deleteCategory
      summary: Delete category
      description: Staff only. Categories with posts are protected by the FK.
      security: [{bearerAuth: []}]
      responses:
        "204":
          description: Deleted.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/forum/posts/:
    get:
      tags: [Forum]
      operationId: listPosts
      summary: List posts
      parameters:
        - $ref: "#/components/parameters/Page"
        - name: category
          in: query
          required: false
          description: Filter by category slug.
          schema:
            type: string
            example: game-dev
      responses:
        "200":
          description: Paginated posts.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedPosts"
